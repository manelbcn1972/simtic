<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead OS · Oportunidades</title><style>body{font:16px system-ui;background:#f5f7fb;color:#172033;margin:40px auto;max-width:960px;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}h1{margin-bottom:4px}.muted{color:#64748b}.card{background:white;border-radius:14px;margin:18px 0;padding:22px;box-shadow:0 2px 12px #dbe2ef}.score{float:right;background:#dcfce7;color:#166534;border-radius:999px;padding:9px 13px;font-weight:700}.tag{background:#e0e7ff;color:#3730a3;padding:4px 8px;border-radius:6px}button{border:0;border-radius:7px;padding:9px 13px;background:#1d4ed8;color:white;margin-right:8px}</style><body><header><div><h1>Lead OS</h1><div class="muted">Cola de oportunidades procedentes de Sales Navigator</div></div><span class="tag">QA</span></header><main id="opportunities"></main><script>const opportunities=[{person:'Ana Prueba',title:'CIO',company:'Empresa Nueva',score:86,reason:'Cambio de empresa · decisora · cuenta objetivo',action:'Contactar en 48 h con felicitación y caso de uso relevante.'}];document.querySelector('#opportunities').innerHTML=opportunities.map(o=>`<article class="card"><span class="score">${o.score}/100</span><h2>${o.person}</h2><p>${o.title} · ${o.company}</p><p class="muted">${o.reason}</p><p><b>Siguiente acción:</b> ${o.action}</p><button>Marcar en revisión</button><button>Descartar</button></article>`).join('')</script></body></html>
